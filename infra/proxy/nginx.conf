# The origin's reverse proxy (OPERATIONS §9.2). Runs as nginx-unprivileged (non-root,
# listens on 8080/8443; compose publishes them as 80/443). Cloudflare terminates the
# visitor's TLS and connects here with the origin certificate; the firewall admits only
# Cloudflare's ranges on 80/443 (`fw-cloudflare-ips`), so `CF-Connecting-IP` passes
# through untouched and the API reads the client address from it
# (FIRE_WATCH_CLIENT_IP_HEADER).

worker_processes auto;
# A proxied connection costs two descriptors; the 768 default caps at ~380 streams.
worker_rlimit_nofile 131072;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 32768;
}

http {
  access_log off;
  server_tokens off;
  client_max_body_size 64k;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Docker's embedded DNS, re-resolved so a recreated container's new address is picked
  # up without restarting the proxy.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api {
    zone api 64k;
    server api:8080 resolve;
    keepalive 64;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  # Plain HTTP: the origin health probe only; everything else goes to HTTPS.
  server {
    listen 8080 default_server;

    location = /healthz {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
    }

    location / {
      return 308 https://$host$request_uri;
    }
  }

  server {
    listen 8443 ssl default_server;
    http2 on;

    ssl_certificate /run/secrets/origin_tls_cert;
    ssl_certificate_key /run/secrets/origin_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;

    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;

    # SSE: buffering would turn "live" into "on flush" (§9.2). The API's 25–30 s comment
    # frame keeps the stream under Cloudflare's 100 s idle cut; the 1 h read timeout is
    # the proxy's own ceiling, after which the client resumes via Last-Event-ID.
    location = /api/v1/stream {
      proxy_pass http://api;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      gzip off;
      add_header X-Accel-Buffering no always;
    }

    location / {
      proxy_pass http://api;
    }
  }
}
