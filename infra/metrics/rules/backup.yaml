# Nightly backup heartbeat (OPERATIONS §1.3, §6.2; TASKS C5, C6).
#
# The backup CLI is a one-shot job: after a successful run it writes
# fire_watch_backup.prom into FIRE_WATCH_METRICS_TEXTFILE_DIR, and Alloy's textfile
# collector exports it. healthchecks.io is this job's primary leg; these rules are the
# second, independent one.
#
# Thresholds are the `nightly-backup` row of freshness_budgets_v1, asserted by
# server/src/app/metrics-rules.test.ts: warn 26 h = 93600 s, critical 50 h = 180000 s.
groups:
  - name: fire-watch-backup
    interval: 5m
    rules:
      - alert: BackupMissedCritical
        expr: time() - max by (env) (fw_job_last_success_timestamp_seconds{job_id="nightly-backup"}) > 180000
        for: 5m
        labels:
          severity: critical
          page: 'true'
        annotations:
          summary: 'No successful nightly backup in 50 hours'

      - alert: BackupLate
        expr: time() - max by (env) (fw_job_last_success_timestamp_seconds{job_id="nightly-backup"}) > 93600
        for: 5m
        labels:
          severity: warning
          page: 'false'
        annotations:
          summary: 'No successful nightly backup in 26 hours'

      - alert: BackupTextfileAbsent
        expr: absent(fw_job_last_success_timestamp_seconds{job_id="nightly-backup"})
        for: 1h
        labels:
          severity: warning
          page: 'false'
        annotations:
          summary: 'The backup textfile is not reaching Grafana Cloud (never written, or not mounted into Alloy)'
