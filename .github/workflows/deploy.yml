# Deploy pipeline (TASKS J4, GATES §3 L-12, OPERATIONS §9.3).
#
# The only route to the host (L-17). A deploy is a manual dispatch from `main` that must
# pass, in order:
#   1. `ci`          — the full ci.yml job set, reused rather than duplicated (review 21 E2);
#   2. `deploy-gate` — infra/deploy-gate: season regime, the 8 L-12 checkboxes, the
#                      pre-season golden replay (box 1, machine-decided) and the
#                      OPERATIONS §9.3 rule 4 freeze boxes. The human boxes are the dispatch
#                      inputs below; an unticked box fails the gate, it is never skipped;
#   3. `image`       — builds the release image for linux/amd64 and pushes it to GHCR as
#                      `ghcr.io/<owner>/fire-watch:<git-sha>` (the tag deploy.sh pulls);
#   4. `host`        — renders the production GitHub Environment into a bundle and runs
#                      `fw-deploy <git-sha> --secrets --registry-login` on the box over SSH.
#                      The trampoline runs that image's own deploy.sh: migrate one-shot,
#                      worker then api restart, smoke, `last_good`, rollback on failure
#                      (OPERATIONS §9.3 rules 1–3, 6; R5-SRE-5);
#   5. `web`         — builds the client against live data with the deploy's snapshot
#                      origin admitted into the CSP, and publishes it to Cloudflare Pages.
#
# The production Environment holds (names only; values never appear in this repo):
#   secrets  DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, FIRE_WATCH_APP_ENV (the whole app.env),
#            FIRE_WATCH_SECRETS_ENV (the whole secrets.env), POSTGRES_PASSWORD,
#            FIRE_WATCH_METRICS_TOKEN, GRAFANA_CLOUD_TOKEN, ORIGIN_TLS_CERT,
#            ORIGIN_TLS_KEY, GHCR_READ_TOKEN, CLOUDFLARE_API_TOKEN
#   vars     DEPLOY_HOST, GHCR_READ_USER, FIRE_WATCH_STATIC_SNAPSHOT_URL,
#            CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PAGES_PROJECT
# app.env's DATABASE_URL ends in `?sslmode=disable`: the compose Postgres has no TLS and is
# reachable only on the stack's internal network (infra/README.md "The deploy path").

name: Deploy

on:
  workflow_dispatch:
    inputs:
      hotfix:
        description: 'Hotfix: exempt from the deploy window and the freeze boxes (needs an incident)'
        type: boolean
        default: false
      incident:
        description: 'Hotfix only: the incident this fixes (OPERATIONS §9.3 rule 4)'
        type: string
        default: ''
      second_ack:
        description: 'Hotfix only: second person acknowledging box 2 during a severe event (06 §5.7)'
        type: string
        default: ''
      l12_2_no_severe_event:
        description: 'L12-2 No active severe event in the AOI'
        type: boolean
        default: false
      l12_3_expand_contract:
        description: 'L12-3 Migration is expand-contract'
        type: boolean
        default: false
      l12_4_alert_logic_flagged:
        description: 'L12-4 Alert-logic diff is none, or flagged defaulting to old behavior'
        type: boolean
        default: false
      l12_5_rollback_rehearsed:
        description: 'L12-5 Rollback rehearsed: one command, under 5 minutes'
        type: boolean
        default: false
      l12_6_kill_switches:
        description: 'L12-6 Kill switches verified in staging'
        type: boolean
        default: false
      l12_7_post_deploy_watch:
        description: 'L12-7 Committed to the 30-min post-deploy watch + manual canary'
        type: boolean
        default: false
      l12_8_physical_push:
        description: 'L12-8 One real push received on a physical device'
        type: boolean
        default: false
      freeze_degradation:
        description: 'FREEZE-DEGRADATION fw_degradation_tier is 0'
        type: boolean
        default: false
      freeze_major_fire:
        description: 'FREEZE-MAJOR-FIRE No active major-fire event'
        type: boolean
        default: false
      freeze_error_budget:
        description: 'FREEZE-ERROR-BUDGET No error-budget freeze in force'
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time, and a queued one is never cancelled by the next. The group
# differs from ci.yml's so the reused workflow cannot deadlock against its caller.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-gate:
    name: Deploy gate (L-12)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Only main deploys
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Deploy gate::deploys run from main only, got ${GITHUB_REF}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build replay and gate
        run: pnpm exec tsc --build server infra/deploy-gate

      # Box 1 evidence. The replay exits 0 while pre-season scenarios are blocked, so
      # the gate reads the stderr notes too; `set +e` keeps a red replay from ending the
      # step before the gate can report it.
      - name: Golden replay (pre-season set)
        run: |
          set +e
          node server/dist/adapters/fixtures/replay-cli.js --gate=pre-season \
            2> "$RUNNER_TEMP/replay.log"
          echo "$?" > "$RUNNER_TEMP/replay.exit"
          cat "$RUNNER_TEMP/replay.log"
          exit 0

      # Free-text inputs travel through env, never through `${{ }}` inside the script,
      # so an input cannot inject shell.
      - name: Evaluate the gate
        env:
          HOTFIX: ${{ inputs.hotfix }}
          INCIDENT: ${{ inputs.incident }}
          SECOND_ACK: ${{ inputs.second_ack }}
          ACTOR: ${{ github.actor }}
          T_L12_2: ${{ inputs.l12_2_no_severe_event }}
          T_L12_3: ${{ inputs.l12_3_expand_contract }}
          T_L12_4: ${{ inputs.l12_4_alert_logic_flagged }}
          T_L12_5: ${{ inputs.l12_5_rollback_rehearsed }}
          T_L12_6: ${{ inputs.l12_6_kill_switches }}
          T_L12_7: ${{ inputs.l12_7_post_deploy_watch }}
          T_L12_8: ${{ inputs.l12_8_physical_push }}
          T_FREEZE_DEGRADATION: ${{ inputs.freeze_degradation }}
          T_FREEZE_MAJOR_FIRE: ${{ inputs.freeze_major_fire }}
          T_FREEZE_ERROR_BUDGET: ${{ inputs.freeze_error_budget }}
        run: |
          args=()
          tick() { if [[ "$1" == "true" ]]; then args+=(--tick "$2"); fi; }
          tick "$T_L12_2" L12-2
          tick "$T_L12_3" L12-3
          tick "$T_L12_4" L12-4
          tick "$T_L12_5" L12-5
          tick "$T_L12_6" L12-6
          tick "$T_L12_7" L12-7
          tick "$T_L12_8" L12-8
          tick "$T_FREEZE_DEGRADATION" FREEZE-DEGRADATION
          tick "$T_FREEZE_MAJOR_FIRE" FREEZE-MAJOR-FIRE
          tick "$T_FREEZE_ERROR_BUDGET" FREEZE-ERROR-BUDGET
          if [[ "$HOTFIX" == "true" ]]; then
            args+=(--hotfix --incident "$INCIDENT")
            if [[ -n "$SECOND_ACK" ]]; then args+=(--second-ack "$SECOND_ACK"); fi
          fi
          node infra/deploy-gate/dist/cli.js "${args[@]}" \
            --replay-exit "$(cat "$RUNNER_TEMP/replay.exit")" \
            --replay-log "$RUNNER_TEMP/replay.log" \
            --actor "$ACTOR" \
            --summary "$GITHUB_STEP_SUMMARY"

  image:
    name: Release image
    needs: deploy-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/fire-watch:${SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx build --platform linux/amd64 --push -t "$image" .
          docker logout ghcr.io

  host:
    name: Deploy to the host
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      # The bundle fw-deploy reads on stdin (infra/cloud-init.yaml). Rendered under
      # umask 077 in the runner's temp dir and deleted by the last step; no value is
      # ever echoed.
      - name: Render the secrets bundle
        env:
          APP_ENV: ${{ secrets.FIRE_WATCH_APP_ENV }}
          SECRETS_ENV: ${{ secrets.FIRE_WATCH_SECRETS_ENV }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FIRE_WATCH_METRICS_TOKEN: ${{ secrets.FIRE_WATCH_METRICS_TOKEN }}
          GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
          ORIGIN_TLS_CERT: ${{ secrets.ORIGIN_TLS_CERT }}
          ORIGIN_TLS_KEY: ${{ secrets.ORIGIN_TLS_KEY }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          umask 077
          b="$RUNNER_TEMP/bundle"
          mkdir -p "$b/secrets"
          need() { if [[ -z "${!1:-}" ]]; then echo "::error title=Deploy::Environment secret for $1 is empty"; exit 1; fi; }
          for v in APP_ENV SECRETS_ENV POSTGRES_PASSWORD FIRE_WATCH_METRICS_TOKEN \
            GRAFANA_CLOUD_TOKEN ORIGIN_TLS_CERT ORIGIN_TLS_KEY GHCR_READ_TOKEN; do need "$v"; done
          printf '%s\n' "$APP_ENV" >"$b/app.env"
          printf '%s\n' "$SECRETS_ENV" >"$b/secrets.env"
          printf '%s' "$POSTGRES_PASSWORD" >"$b/secrets/postgres_password"
          printf '%s' "$FIRE_WATCH_METRICS_TOKEN" >"$b/secrets/fire_watch_metrics_token"
          printf '%s' "$GRAFANA_CLOUD_TOKEN" >"$b/secrets/grafana_cloud_token"
          printf '%s\n' "$ORIGIN_TLS_CERT" >"$b/secrets/origin_tls_cert"
          printf '%s\n' "$ORIGIN_TLS_KEY" >"$b/secrets/origin_tls_key"
          printf '%s' "$GHCR_READ_TOKEN" >"$b/secrets/ghcr_token"
          tar -C "$b" -cf "$RUNNER_TEMP/bundle.tar" app.env secrets.env secrets
          rm -rf "$b"

      - name: SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts

      # deploy.sh exits non-zero after a rollback too, so a rolled-back deploy is a red
      # run — never a green one that shipped nothing.
      - name: fw-deploy
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          GHCR_READ_USER: ${{ vars.GHCR_READ_USER }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes "deploy@${HOST}" \
            sudo /usr/local/sbin/fw-deploy "$SHA" --secrets --registry-login "$GHCR_READ_USER" \
            <"$RUNNER_TEMP/bundle.tar"

      - name: Remove the rendered secrets
        if: always()
        run: rm -rf "$RUNNER_TEMP/bundle.tar" "$RUNNER_TEMP/bundle" ~/.ssh/id_deploy

  web:
    name: Publish the web client
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # FIRE_WATCH_DEPLOY_ENV=production + VITE_FIRE_WATCH_DATA=live: vite.config.ts
      # refuses a production build on the committed fixtures and leaves `fixtures/` out
      # (FD-5). FIRE_WATCH_STATIC_SNAPSHOT_URL admits the snapshot origin into every
      # policy line of dist/_headers (OPERATIONS §9.3 rule 7, R5-SRE-5).
      - name: Build
        env:
          FIRE_WATCH_DEPLOY_ENV: production
          VITE_FIRE_WATCH_DATA: live
          FIRE_WATCH_STATIC_SNAPSHOT_URL: ${{ vars.FIRE_WATCH_STATIC_SNAPSHOT_URL }}
        run: pnpm --filter "@fire-watch/web..." run build

      # The event shell Function sends its own policy, so it learns the same origin from
      # a Pages variable rather than from the build.
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SNAPSHOT_URL: ${{ vars.FIRE_WATCH_STATIC_SNAPSHOT_URL }}
          SHA: ${{ github.sha }}
        run: |
          # From web/, so wrangler picks up web/functions next to the output.
          cd web
          printf '%s' "$SNAPSHOT_URL" |
            pnpm dlx wrangler@4.40.3 pages secret put FW_STATIC_SNAPSHOT_URL --project-name "$PROJECT"
          pnpm dlx wrangler@4.40.3 pages deploy dist --project-name "$PROJECT" \
            --branch main --commit-hash "$SHA"
